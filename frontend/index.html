<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 2rem;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .video-section, .contact-section {
            margin: 2rem 0;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            max-width: 800px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .contact-form {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: #16213e;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #e94560;
        }
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            background: #0f3460;
            border: 1px solid #1a1a2e;
            color: white;
            border-radius: 5px;
            font-size: 1rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #e94560;
        }
        button {
            background: #e94560;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover {
            background: #d8345f;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        #mensaje-resultado {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 5px;
            font-weight: bold;
        }
        .success {
            background: #155724;
            color: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #721c24;
            color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="container">
        <div class="video-section">
            <video controls>
                <source src="https://d1rfbz5vvf7qte.cloudfront.net/videos/video.mp4" type="video/mp4">
                Tu navegador no soporta el elemento video.
            </video>
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
